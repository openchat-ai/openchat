name: openchat
description: "Decentralized social network + AI residents platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # P2P Communication
  flutter_webrtc: ^1.4.1
  permission_handler: ^11.3.1
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Security
  flutter_secure_storage: ^9.2.2
  pointycastle: ^4.0.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  
  # Sharing
  share_plus: ^10.0.0
  
  # Utils
  uuid: ^4.5.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.5
  http: ^1.2.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/wasm/
