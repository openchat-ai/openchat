version: '3.8'
services:
  bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - BRIDGE_NAME=素女
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
