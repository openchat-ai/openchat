name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '**.txt']
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build APK'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  flutter-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openchat-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41' }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

  bridge-check:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: bridge/package-lock.json }
      - run: npm ci
      - run: npx eslint src/ --quiet
      - run: npm test

  bridge-build:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_apk) }}
    needs: [bridge-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm pack

  flutter-apk:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_apk) }}
    needs: [flutter-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    defaults:
      run:
        working-directory: openchat-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41' }
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: node ../scripts/gen-version.mjs lib/core/version.dart
      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release --target-platform android-arm64 --split-debug-info=build/debug-info
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/openchat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openchat-apk
          path: openchat-flutter/build/app/outputs/flutter-apk/openchat.apk
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          # Delete all old APK releases (keep versioned tags like v0.1.0)
          for RELEASE in $(gh release list --limit 50 --json tagName --jq '.[].tagName'); do
            if echo "$RELEASE" | grep -q '^apk-'; then
              gh release delete "$RELEASE" --yes
              git push --delete origin "refs/tags/$RELEASE" 2>/dev/null || true
            fi
          done
          # Create new release
          TAG="apk-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --title "OpenChat APK $(date +%Y-%m-%d)" \
            --generate-notes \
            "openchat-flutter/build/app/outputs/flutter-apk/openchat.apk"

  cleanup:
    if: ${{ always() && github.event_name == 'push' }}
    needs: [bridge-check]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep only 2 most recent workflow runs on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_IDS=$(gh run list --branch main --limit 50 --json databaseId \
            --jq '.[].databaseId' | tail -n +3)
          for id in $RUN_IDS; do
            gh run delete "$id" --yes 2>/dev/null || true
          done
