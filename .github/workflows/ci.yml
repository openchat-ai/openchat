name: CI
on: [push, pull_request]
jobs:
  bridge-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test

  bridge-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - name: Verify npm pack
        run: npm pack --dry-run
      - name: Build Docker image
        run: docker build -t openchat-bridge .

  flutter-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openchat-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41' }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openchat-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.41' }
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: openchat-apk
          path: openchat-flutter/build/app/outputs/flutter-apk/*.apk
