name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Bridge 后端测试
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: cd bridge && npm install

      - name: Core tests
        run: cd bridge && npm test

      - name: Integration tests
        run: cd bridge && npm run test:integration

  # Flutter 客户端测试
  flutter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.11.0'

      - name: Install dependencies
        run: cd openchat-flutter && flutter pub get

      - name: Run tests
        run: cd openchat-flutter && flutter test
