name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # Bridge 后端测试
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd bridge && npm install

      - name: Syntax check
        run: |
          cd bridge
          node --check src/core/agent-session.js
          node --check src/core/agent-engine.js
          node --check src/core/agent-monitor.js

      - name: Unit tests
        run: cd bridge && npm test

      - name: Chaos tests
        run: cd bridge && npm run test:chaos

      - name: Property tests
        run: cd bridge && npm run test:property

  # App 客户端测试
  app-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      - name: Install dependencies
        run: cd app && flutter pub get

      - name: Run tests
        run: cd app && flutter test

  # LLM 评测（可选，手动触发或发布前）
  llm-evaluation:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd bridge && npm install

      - name: Run LLM Judge
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: cd bridge && npm run test:llm-judge
