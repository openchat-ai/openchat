name: openchat_flutter
description: "OpenChat Flutter API client library"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.0
  http: ^1.2.0
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.0
  connectivity_plus: ^6.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  crypto: ^3.0.6
  record: ^6.0.0
  audioplayers: ^6.1.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true